title: Deserialization of Untrusted Data - Java
id: 12345678-1234-1234-1234-123456789012
status: experimental
description: Detects potential deserialization of untrusted data in Java applications
author: Cipher
date: 2026-11-25
logsource:
  category: process_creation
  product: windows
  service: java
detection:
  selection:
    Image|endswith:
      - 'java.exe'
    CommandLine|contains:
      - 'ObjectInputStream'
      - 'deserialize'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Legitimate Java applications using safe deserialization practices
level: high