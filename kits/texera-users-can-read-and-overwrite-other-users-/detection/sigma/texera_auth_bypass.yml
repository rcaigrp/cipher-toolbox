title: Texera Workflow Result Unauthorized Access
id: 12345678-1234-1234-1234-123456789012
status: experimental
description: Detects unauthorized access to workflow results in Apache Texera, potentially indicating CVE-2026-96295 exploitation.
author: Cipher
date: 2026-11-22
logsource:
    category: application
    product: texera
    service: workflow_result_access
detection:
    selection:
        operation: ['read', 'overwrite']
        resource_type: 'workflow_result'
        outcome: 'success'
        expected_access: 'denied'
    condition: selection
fields:
    - actor
    - result_id
    - operation
    - timestamp
falsepositives:
    - Legitimate access by authorized users with elevated privileges
level: high
tags:
    - CVE-2026-96295
    - authorization_bypass
    - texera