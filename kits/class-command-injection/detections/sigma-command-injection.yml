title: Command Injection Attempt
id: 12345678-1234-5678-1234-567812345678
status: experimental
description: Detects potential command injection attempts in system logs
author: Cipher
date: 2026/11/23
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine:
            - '*;*'
            - '*|*'
            - '*&*'
            - '*`*'
            - '*$()*'
            - '*$(*)*'
    condition: selection
fields:
    - CommandLine
    - User
    - Image
falsepositives:
    - Legitimate administrative scripts
level: high