title: Shell or Network Utility Spawned by a Document Renderer
id: 85373ca9-6480-44e4-9232-06f2ca9fe799
status: experimental
description: Detects unexpected child processes from document renderers on Linux conversion workers.
logsource:
  category: process_creation
  product: linux
detection:
  renderer:
    ParentImage|endswith:
      - '/gs'
      - '/gs.bin'
      - '/magick'
      - '/convert'
      - '/pdftoppm'
      - '/pdftocairo'
      - '/mutool'
      - '/soffice.bin'
  child:
    Image|endswith:
      - '/sh'
      - '/dash'
      - '/bash'
      - '/curl'
      - '/wget'
      - '/nc'
      - '/socat'
  condition: renderer and child
falsepositives:
  - Configured delegates and wrapper scripts. Verify the executable path and job context before tuning.
level: high
