title: Potential Shell Injection Attempt
id: 12345678-1234-1234-1234-123456789012
status: experimental
description: Detects potential shell injection attempts based on command execution patterns with suspicious characters
author: Cipher
date: 2026/11/23
logsource:
    category: process_creation
    product: windows
    service: cmd
detection:
    selection:
        CommandLine:
            - '*`*'
            - '*$()*'
            - '*;*'
            - '*|*'
            - '*&*'
            - '*||*'
            - '*&&*'
            - '*$(*)*'
    condition: selection
fields:
    - Image
    - CommandLine
    - User
falsepositives:
    - Legitimate use of shell features
level: high