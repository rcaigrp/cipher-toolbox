title: AddressSanitizer Heap Buffer Overflow Write
id: 61d37ae1-cd7d-4a56-9caf-8c710fb71a3d
status: experimental
description: Detects heap out-of-bounds writes reported by AddressSanitizer in multiline Linux application diagnostics.
logsource:
    product: linux
    service: asan
    definition: Collect each complete sanitizer report into a single event and map its text to Message.
detection:
    selection:
        Message|contains|all:
            - 'ERROR: AddressSanitizer: heap-buffer-overflow'
            - 'WRITE of size '
    condition: selection
fields:
    - Message
falsepositives:
    - Intentional sanitizer self-tests
    - Application defects triggered without malicious input
level: medium
