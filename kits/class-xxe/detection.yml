title: "XXE Detection Rule"
id: "xxe-detection-rule"
status: "experimental"
description: |
  Detects potential XXE vulnerabilities by looking for XML parsing patterns that might allow external entity resolution.
tags:
  - xml
  - security
  - vulnerability
  - detection
logsource:
  category: application
  product: xml_parser
detection:
  selection:
    # Look for patterns that indicate XML parsing with potential XXE issues
    - 'xml.*parse'
    - 'SAXParser'
    - 'DOMParser'
    - 'XMLReader'
    - 'external.*entity'
  condition: selection
fields:
  - user
  - process
  - message
false_positives:
  - Legitimate XML processing that doesn't involve external entities
level: medium