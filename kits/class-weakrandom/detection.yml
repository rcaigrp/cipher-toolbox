title: "Weak Random Number Generation Detection"
id: "weak_rng_detection"
status: "experimental"
description: |
  Detects patterns indicative of weak random number generation usage.
logsource:
  category: "application"
  product: "generic"
detection:
  selection:
    # Look for common insecure random function calls
    - 'random.randint'
    - 'random.random'
    - 'random.randrange'
    - 'random.choice'
    - 'random.shuffle'
    - 'rand()'
    - 'srand()'
    - 'randomize()'
    - 'time()'
  condition: selection
fields:
  - user
  - process_name
  - message
falsepositives:
  - Legitimate use of random for non-security purposes
level: "medium"