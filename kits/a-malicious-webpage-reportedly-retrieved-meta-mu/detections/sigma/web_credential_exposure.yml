title: Sensitive Assistant Tool Access Without Approval After Web Content
id: c8fdcec6-b75f-48a7-9110-1da9e8793397
status: experimental
description: Flags successful assistant access to chat history or saved memories in a browsing context without recorded approval. Requires normalized audit events from an assistant gateway.
logsource:
    category: application
    service: assistant_gateway
    definition: Map trusted gateway audit fields to this schema. The gateway must attribute web context to the tool call and explicitly normalize absent or unverifiable approval to missing or unknown.
detection:
    selection:
        event_type: assistant_tool_access
        context_source: web_content
        resource_type:
            - chat_history
            - saved_memory
        outcome: allowed
        approval_status:
            - missing
            - denied
            - unknown
    condition: selection
fields:
    - session_id
    - tool_call_id
    - resource_type
    - approval_status
falsepositives:
    - Approval telemetry omissions or incorrect correlation between browsing and tool calls
level: high
